name: Publish Günİzi v0.8 AI Test Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v08-test.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact tested build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="numandegirmenci/gunizi-android"
          RUN="44970772484"
          SHA="856dc7d85913fedcd000e705e82d89a245c33121"
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .conclusion)" = "success"
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .head_sha)" = "$SHA"
          mkdir -p "$RUNNER_TEMP/gunizi"
          gh run download "$RUN" --repo "$REPO" --name GunIzi-debug-apk --dir "$RUNNER_TEMP/gunizi"
          FILE="$(find "$RUNNER_TEMP/gunizi" -maxdepth 3 -name '*.apk' -type f | head -n 1)"
          test -n "$FILE" && test -s "$FILE"
          cp "$FILE" GunIzi-v0.8.0-test.apk
          sha256sum GunIzi-v0.8.0-test.apk
          test "$(find "$RUNNER_TEMP/gunizi" -type f -name '*.apk' | wc -l)" -eq 1
      - name: Verify Android package and version code
        run: |
          set -euo pipefail
          unzip -t GunIzi-v0.8.0-test.apk | tail -n 1
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging GunIzi-v0.8.0-test.apk | head -n 1 | tee package.txt
          grep -q "name='com.gunizi.app'" package.txt
          grep -q "versionCode='8'" package.txt
      - name: Publish exact v0.8.0 tested APK for update notification testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="numandegirmenci/gunizi-android"
          TAG="test-v0.8.0"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Existing test release preserved; will not replace the APK."
            gh release view "$TAG" --repo "$REPO" --json url,assets
            exit 0
          fi
          {
            printf 'versionCode: 8\n\n'
            printf '## Günİzi v0.8.0 – Yapay Zeka Test Sürümü\n\n'
            printf 'Bu APK, GitHub Actions üzerinde derlenen ve otomatik testleri geçen geliştirme sürümüdür. '
            printf '**Yeni sürüm bildirimi ve yenilik ekranını test etmek** için yayımlanmıştır.\n\n'
            tail -n +2 release-notes/v0.8.0.md
            printf '\n\n### Önemli güncelleme sınırı\n\n'
            printf 'Bu APK geçici GitHub Actions **debug imzasını** kullanır. Önceki v0.6 veya v0.7 APK ile '
            printf 'imza farklıysa mevcut uygulamanın üzerine kurulamaz. **Kayıtları yedeklemeden uygulamayı kaldırmayın.** '
            printf 'Bu yayın imzalı kalıcı güncelleme değildir. Kalıcı imza anahtarı için '
            printf '[kurulum rehberine](https://github.com/numandegirmenci/gunizi-android/blob/main/docs/UPDATE_SETUP.md) bakın.\n'
          } > notes.md
          gh release create "$TAG" GunIzi-v0.8.0-test.apk \
            --repo "$REPO" --target 856dc7d85913fedcd000e705e82d89a245c33121 \
            --title "Günİzi v0.8.0 – Yapay Zeka (TEST)" \
            --notes-file notes.md --latest
          gh release view "$TAG" --repo "$REPO" --json url,assets
