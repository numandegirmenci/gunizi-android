name: Publish Günİzi CallVault Native AI v0.11 TEST
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v011-native-test.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact native AI build and its tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="numandegirmenci/gunizi-android"
          RUN_ID="44978468958"
          SOURCE_SHA="5b68b022ece4dd500f71046a7b6820fce5832b35"
          for n in $(seq 1 150); do
            STATUS="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .status)"
            if [ "$STATUS" = "completed" ]; then break; fi
            sleep 10
          done
          test "$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .conclusion)" = success ||
            { echo "::error::Native APK build/unit tests have not passed"; exit 1; }
          test "$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$SOURCE_SHA" ||
            { echo "::error::Source SHA mismatch"; exit 1; }
          mkdir -p "$RUNNER_TEMP/native-ai"
          gh run download "$RUN_ID" --repo "$REPO" --name GunIzi-debug-apk --dir "$RUNNER_TEMP/native-ai"
          APK="$(find "$RUNNER_TEMP/native-ai" -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test "$(find "$RUNNER_TEMP/native-ai" -type f -name '*.apk' | wc -l)" -eq 1
          cp "$APK" GunIzi-CallVault-Native-v0.11.0-Test.apk
          sha256sum GunIzi-CallVault-Native-v0.11.0-Test.apk
      - name: Validate package identity, native libraries, VAD asset and signing
        run: |
          set -euo pipefail
          APK="GunIzi-CallVault-Native-v0.11.0-Test.apk"
          unzip -tq "$APK" | tail -n 2
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | head -n 1 | tee package.txt
          grep -F "name='com.gunizi.app.ai3'" package.txt
          grep -F "versionCode='12'" package.txt
          grep -F "versionName='0.11.0-test'" package.txt
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libwhispercv.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libllamacv.so'
          unzip -Z1 "$APK" | grep -F 'assets/ggml-silero-v5.1.2.bin'
          "$SIGNER" verify "$APK"
      - name: Publish isolated beta without touching signed main app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="numandegirmenci/gunizi-android"
          TAG="test-v0.11.0"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Existing release must not be overwritten"
            exit 1
          fi
          gh release create "$TAG" GunIzi-CallVault-Native-v0.11.0-Test.apk \
            --repo "$REPO" --target "5b68b022ece4dd500f71046a7b6820fce5832b35" \
            --title "Günİzi v0.11.0 • CallVault Whisper + Silero + Gemma (TEST)" \
            --notes-file release-notes/v0.11.0.md --prerelease
          gh release view "$TAG" --repo "$REPO" --json url,assets,isPrerelease
