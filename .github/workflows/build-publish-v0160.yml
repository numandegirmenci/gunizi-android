name: Günİzi v0.16.0 Stable Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-publish-v0160.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gunizi-v0160-stable
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Guard user-facing update and recording safety contracts
        run: |
          set -euo pipefail
          grep -F 'auto.setEnabled(true);' app/src/main/java/com/gunizi/app/MainActivity.java
          grep -F 'auto.setChecked(AppUpdateWorker.enabled(this));' app/src/main/java/com/gunizi/app/MainActivity.java
          grep -F 'AppUpdateWorker.independent(this)' app/src/main/java/com/gunizi/app/MainActivity.java
          grep -F 'if(independent(c))' app/src/main/java/com/gunizi/app/AppUpdateWorker.java
          grep -F 'ReleaseVersion.compare(tag,installedInfo.versionName)' app/src/main/java/com/gunizi/app/AppUpdateWorker.java
          test -f app/src/test/java/com/gunizi/app/ReleaseVersionTest.java
          grep -F 'ReleaseApkValidator.verify(this,file)' app/src/main/java/com/gunizi/app/UpdateActivity.java
          grep -F 'HistoryScheduleWindow.active' app/src/main/java/com/gunizi/app/Prefs.java
          grep -F 'LiveTranscriptStore.append' app/src/main/java/com/gunizi/app/CallVaultWhisperEngine.kt
          grep -F 'WHISPER_TURBO_Q8' app/src/main/java/com/gunizi/app/AnalysisPreferences.java
          grep -F 'AiModelStore.GEMMA' app/src/main/java/com/gunizi/app/Prefs.java
          test -f third_party/callvault/app/src/main/cpp/whispercv.cpp
          test -f third_party/callvault/third_party/whisper.cpp/CMakeLists.txt
          test -f third_party/callvault/third_party/llama.cpp/CMakeLists.txt
          test -f third_party/callvault/app/src/main/assets/ggml-silero-v5.1.2.bin
      - name: Compile Android and run all JVM tests
        run: |
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:testDebugUnitTest
      - name: Verify isolated debug APK and native libraries
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | head -n 1 | tee package.txt
          grep -F "name='com.gunizi.app.ai16'" package.txt
          grep -F "versionCode='21'" package.txt
          grep -F "versionName='0.16.0'" package.txt
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libwhispercv.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libllamacv.so'
          unzip -Z1 "$APK" | grep -F 'assets/ggml-silero-v5.1.2.bin'
          "$SIGNER" verify "$APK"
      - name: Check for permanent production signing
        env:
          GUNIZI_KEYSTORE_BASE64: ${{ secrets.GUNIZI_KEYSTORE_BASE64 }}
          GUNIZI_KEYSTORE_PASSWORD: ${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}
          GUNIZI_KEY_ALIAS: ${{ secrets.GUNIZI_KEY_ALIAS }}
          GUNIZI_KEY_PASSWORD: ${{ secrets.GUNIZI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$GUNIZI_KEYSTORE_BASE64" ] && [ -n "$GUNIZI_KEYSTORE_PASSWORD" ] && \
             [ -n "$GUNIZI_KEY_ALIAS" ] && [ -n "$GUNIZI_KEY_PASSWORD" ]; then
            printf '%s' "$GUNIZI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gunizi-release.keystore"
            chmod 600 "$RUNNER_TEMP/gunizi-release.keystore"
            echo "GUNIZI_KEYSTORE_PATH=$RUNNER_TEMP/gunizi-release.keystore" >> "$GITHUB_ENV"
            echo "PERMANENT_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "PERMANENT_SIGNING=false" >> "$GITHUB_ENV"
            echo "::notice::No permanent release keystore: distributing safe independent .ai16 APK."
          fi
      - name: Build signed production APK only when stable keystore is configured
        if: env.PERMANENT_SIGNING == 'true'
        env:
          GUNIZI_KEYSTORE_PASSWORD: ${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}
          GUNIZI_KEY_ALIAS: ${{ secrets.GUNIZI_KEY_ALIAS }}
          GUNIZI_KEY_PASSWORD: ${{ secrets.GUNIZI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | head -n 1 | grep -F "name='com.gunizi.app'"
          "$SIGNER" verify --verbose "$APK"
          "$SIGNER" verify --print-certs "$APK" | tee certificate.txt
      - name: Prepare release APK and accurate installation notes
        run: |
          set -euo pipefail
          if [ "$PERMANENT_SIGNING" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk GunIzi-v0.16.0.apk
            cat > install-note.md <<'NOTE'
          versionCode: 21

          ## Kurulum

          Kalıcı anahtar ile imzalanan üretim paketi (com.gunizi.app). Android,
          kurulu uygulamanın imzası da aynıysa kayıtlar silinmeden güncellemeye izin verebilir.
          Farklı imzalı sürümleri kaldırıp veri kaybı oluşturmayın.

          NOTE
          else
            cp app/build/outputs/apk/debug/app-debug.apk GunIzi-v0.16.0.apk
            cat > install-note.md <<'NOTE'
          versionCode: 21

          ## Kurulum — önemli

          Bu APK **com.gunizi.app.ai16** kimliğiyle bağımsız kurulur.
          Önceki Günİzi'nin veya farklı AI APK'larının üzerine yüklenen güncelleme değildir.
          Önceki kayıtları, notları veya modelleri silmeyin; otomatik aktarılmaz.
          Kalıcı üretim imza anahtarı tanımlanana kadar gerçek yerinde güncelleme yapılamaz.

          NOTE
          fi
          cat release-notes/v0.16.0.md >> install-note.md
          sha256sum GunIzi-v0.16.0.apk | tee SHA256.txt
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GunIzi-v0.16.0-APK
          path: |
            GunIzi-v0.16.0.apk
            SHA256.txt
            install-note.md
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GunIzi-v0.16.0-APK
      - name: Publish normal Latest GitHub Release (never beta)
        env:
          GH_TOKEN: ${{ secrets.GUNIZI_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          test -s GunIzi-v0.16.0.apk
          sha256sum --check SHA256.txt
          TAG="v0.16.0"
          HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$GITHUB_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Main advanced since this build; refusing to publish stale APK."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to replace existing v0.16.0 release."
            exit 1
          fi
          gh release create "$TAG" GunIzi-v0.16.0.apk SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Günİzi v0.16.0" --notes-file install-note.md --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,assets,isPrerelease,isDraft
