name: Android debug APK
on:
  push:
    branches: [belgeizi-v0.1.1-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bundle offline Turkish OCR model
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fL --retry 3 --connect-timeout 15 \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/e12c65a915945e4c28e237a9b52bc4a8f39a0cec/tur.traineddata" \
            -o app/src/main/assets/tessdata/tur.traineddata
          test "$(stat -c%s app/src/main/assets/tessdata/tur.traineddata)" -gt 1000000
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BelgeIzi-debug-v0.1.3
          path: app/build/outputs/apk/debug/app-debug.apk
