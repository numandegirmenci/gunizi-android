name: Publish Günİzi v0.13.1 Latest
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0131-latest.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exactly the successful verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="numandegirmenci/gunizi-android"
          RUN="44990731686"
          SHA="6b6d425c37f0a6562167c2f1f3faffacf956b7f3"
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .conclusion)" = "success"
          test "$(gh api "repos/$REPO/actions/runs/$RUN" --jq .head_sha)" = "$SHA"
          mkdir -p "$RUNNER_TEMP/release"
          gh run download "$RUN" --repo "$REPO" --name GunIzi-v0.13.1-APK --dir "$RUNNER_TEMP/release"
          APK="$(find "$RUNNER_TEMP/release" -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test "$(find "$RUNNER_TEMP/release" -type f -name '*.apk' | wc -l)" -eq 1
          cp "$APK" GunIzi-v0.13.1.apk
          echo "efd129afc46f0f782c972554bb2af4b14186a24dabeece4dc70b996ac807cb14  GunIzi-v0.13.1.apk" | sha256sum --check
      - name: Verify package, version and APK signature
        run: |
          set -euo pipefail
          APK="GunIzi-v0.13.1.apk"
          unzip -tq "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | head -n 1 | tee package.txt
          grep -F "name='com.gunizi.app.ai8'" package.txt
          grep -F "versionCode='17'" package.txt
          grep -F "versionName='0.13.1'" package.txt
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libwhispercv.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libllamacv.so'
          unzip -Z1 "$APK" | grep -F 'assets/ggml-silero-v5.1.2.bin'
          "$SIGNER" verify "$APK"
      - name: Publish normal GitHub Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="numandegirmenci/gunizi-android"
          TAG="v0.13.1"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite"
            exit 1
          fi
          # Fallback to authenticated Git transport instead of the denied REST create-ref route.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "6b6d425c37f0a6562167c2f1f3faffacf956b7f3"
            git push origin "refs/tags/$TAG"
          fi
          cat > notes.md <<'NOTES'
          ## Günİzi v0.13.1

          Günİzi'nin güncel Android sürümü.

          - Analiz düğmesi ve kuyruğa alma geri bildirimleri iyileştirildi.
          - İşlem paneli doğrudan ekranda; bekleme ve gerçek işlem süreleri ayrılıyor.
          - İlk 12 saniyelik konuşma bölümü, ardından 30 saniyelik döküm bölümleri.
          - Canlı takip ekranı ve günlük iş hafızası daha görünür.
          - Yeni kurulumda daha hafif Whisper Small Q5 varsayılan.

          ### Kurulum uyarısı
          Uygulama kimliği com.gunizi.app.ai8 ve imzası GitHub Actions debug imzasıdır.
          Mevcut com.gunizi.app veya diğer AI kurulumlarının üzerine yüklenmez; ayrı kurulur.
          Eski Günİzi uygulamasını silmeyin. Ses kayıtları ve modeller otomatik taşınmaz.

          Android CI derlemesi, birim testleri, APK imzası ve yerel kütüphaneler doğrulandı.
          Gerçek Samsung cihazında uçtan uca konuşma çözümleme ve uzun kayıt testi henüz yapılmadı.
          NOTES
          gh release create "$TAG" GunIzi-v0.13.1.apk \
            --repo "$REPO" --target "6b6d425c37f0a6562167c2f1f3faffacf956b7f3" \
            --title "Günİzi v0.13.1" --notes-file notes.md --verify-tag --latest
          gh release view "$TAG" --repo "$REPO" --json url,isPrerelease,isDraft,assets
