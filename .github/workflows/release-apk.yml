name: Signed Android Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Verify release configuration and private signing key
        env:
          SIGNING_KEY: ${{ secrets.GUNIZI_KEYSTORE_BASE64 }}
          GUNIZI_KEYSTORE_PASSWORD: ${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}
          GUNIZI_KEY_ALIAS: ${{ secrets.GUNIZI_KEY_ALIAS }}
          GUNIZI_KEY_PASSWORD: ${{ secrets.GUNIZI_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY" || (echo "Set GUNIZI_KEYSTORE_BASE64 secret first" && exit 1)
          test -n "$GUNIZI_KEYSTORE_PASSWORD" || exit 1
          test -n "$GUNIZI_KEY_ALIAS" || exit 1
          test -n "$GUNIZI_KEY_PASSWORD" || exit 1
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/gunizi-release.keystore"
          echo "GUNIZI_KEYSTORE_PATH=$RUNNER_TEMP/gunizi-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          GUNIZI_KEYSTORE_PASSWORD: ${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}
          GUNIZI_KEY_ALIAS: ${{ secrets.GUNIZI_KEY_ALIAS }}
          GUNIZI_KEY_PASSWORD: ${{ secrets.GUNIZI_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature and version
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$ZIPALIGN" verify --verbose "$APK"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\\([0-9][0-9]*\\).*/\\1/p' app/build.gradle | head -1)"
          test -n "$VERSION_CODE"
          echo "GUNIZI_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          sha256sum "$APK"
      - name: Publish release from version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="app/build/outputs/apk/release/app-release.apk"
          DEST="GunIzi-${GITHUB_REF_NAME}.apk"
          cp "$FILE" "$DEST"
          printf "versionCode: %s\n\nSigned Günİzi Android release. Installation requires user approval.\n" "$GUNIZI_VERSION_CODE" > release-notes.txt
          gh release create "$GITHUB_REF_NAME" "$DEST" --verify-tag --title "Günİzi $GITHUB_REF_NAME" --notes-file release-notes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GunIzi-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
