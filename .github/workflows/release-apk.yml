name: Signed Android Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Confirm permanent private signing key is configured
        env:
          SIGNING_KEY: ${{ secrets.GUNIZI_KEYSTORE_BASE64 }}
          GUNIZI_KEYSTORE_PASSWORD: ${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}
          GUNIZI_KEY_ALIAS: ${{ secrets.GUNIZI_KEY_ALIAS }}
          GUNIZI_KEY_PASSWORD: ${{ secrets.GUNIZI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ] || [ -z "$GUNIZI_KEYSTORE_PASSWORD" ] || [ -z "$GUNIZI_KEY_ALIAS" ] || [ -z "$GUNIZI_KEY_PASSWORD" ]; then
            echo "::error::Release signing Secrets are missing; will NOT publish an incompatible APK."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/gunizi-release.keystore"
          chmod 600 "$RUNNER_TEMP/gunizi-release.keystore"
          echo "GUNIZI_KEYSTORE_PATH=$RUNNER_TEMP/gunizi-release.keystore" >> "$GITHUB_ENV"
      - name: Validate version and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\\([0-9][0-9]*\\).*/\\1/p' app/build.gradle | head -n 1)"
          NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n 1)"
          test -n "$CODE"
          test -n "$NAME"
          NOTES="release-notes/v$NAME.md"
          test -f "$NOTES" || (echo "::error::Missing $NOTES" && exit 1)
          grep -Fx "versionCode: $CODE" "$NOTES"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$TAG" = "v$NAME" || (echo "::error::Tag v$NAME required" && exit 1)
          fi
          echo "RELEASE_NOTES_FILE=$NOTES" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          GUNIZI_KEYSTORE_PASSWORD: ${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}
          GUNIZI_KEY_ALIAS: ${{ secrets.GUNIZI_KEY_ALIAS }}
          GUNIZI_KEY_PASSWORD: ${{ secrets.GUNIZI_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signing and package identity
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | head -n 1 | grep "name='com.gunizi.app'"
          sha256sum "$APK"
      - name: Publish signed APK with human readable changes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Refusing to silently replace signed APK."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "GunIzi-$TAG.apk"
          gh release create "$TAG" "GunIzi-$TAG.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Günİzi $TAG" --notes-file "$RELEASE_NOTES_FILE" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: GunIzi-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
