name: Publish Günİzi v0.12.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-gunizi-v0120.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gunizi-v0120
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check offline AI sources
        run: |
          test -f third_party/callvault/app/src/main/cpp/whispercv.cpp
          test -f third_party/callvault/third_party/whisper.cpp/CMakeLists.txt
          test -f third_party/callvault/third_party/llama.cpp/CMakeLists.txt
          test -f third_party/callvault/app/src/main/assets/ggml-silero-v5.1.2.bin
      - name: Compile Android and run JVM tests
        run: |
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:testDebugUnitTest
      - name: Validate isolated signed APK package
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK" > /dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | head -n 1 | tee package.txt
          grep -F "name='com.gunizi.app.ai6'" package.txt
          grep -F "versionCode='15'" package.txt
          grep -F "versionName='0.12.0'" package.txt
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libwhispercv.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libllamacv.so'
          unzip -Z1 "$APK" | grep -F 'assets/ggml-silero-v5.1.2.bin'
          "$SIGNER" verify "$APK"
          sha256sum "$APK"
      - name: Check permanent release signing
        env:
          SIGNING_KEY: ${{ secrets.GUNIZI_KEYSTORE_BASE64 }}
          GUNIZI_${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}WORD: ${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}
          GUNIZI_KEY_ALIAS: ${{ secrets.GUNIZI_KEY_ALIAS }}
          GUNIZI_KEY_PASSWORD: ${{ secrets.GUNIZI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$SIGNING_KEY" ] && [ -n "$GUNIZI_${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}WORD" ] && [ -n "$GUNIZI_KEY_ALIAS" ] && [ -n "$GUNIZI_KEY_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/gunizi-release.keystore"
            chmod 600 "$RUNNER_TEMP/gunizi-release.keystore"
            echo "GUNIZI_KEYSTORE_PATH=$RUNNER_TEMP/gunizi-release.keystore" >> "$GITHUB_ENV"
            echo "PERMANENT_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "PERMANENT_SIGNING=false" >> "$GITHUB_ENV"
            echo "::notice::No permanent signing key; publish separate app-ID APK, never replace existing installation."
          fi
      - name: Build official release when permanent signing configured
        if: env.PERMANENT_SIGNING == 'true'
        env:
          GUNIZI_${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}WORD: ${{ secrets.GUNIZI_KEYSTORE_PASSWORD }}
          GUNIZI_KEY_ALIAS: ${{ secrets.GUNIZI_KEY_ALIAS }}
          GUNIZI_KEY_PASSWORD: ${{ secrets.GUNIZI_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$SIGNER" verify "$APK"
          "$AAPT" dump badging "$APK" | head -n 1 | grep -F "name='com.gunizi.app'"
          sha256sum "$APK"
      - name: Prepare APK and installation warning
        run: |
          set -euo pipefail
          if [ "$PERMANENT_SIGNING" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk GunIzi-v0.12.0.apk
            echo "Resmi Günİzi paketi. Kurulu uygulamanın imzası aynıysa üstüne güncellenebilir." > install-note.txt
          else
            cp app/build/outputs/apk/debug/app-debug.apk GunIzi-v0.12.0.apk
            echo "ÖNEMLİ: Bu APK önceki uygulamanın güncellemesi değildir. com.gunizi.app.ai6 kimliğiyle ayrı kurulur. Önceki kayıtları silme. Modeller otomatik taşınmaz." > install-note.txt
          fi
          cat release-notes/v0.12.0.md >> install-note.txt
          sha256sum GunIzi-v0.12.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GunIzi-v0.12.0-APK
          path: GunIzi-v0.12.0.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish Günİzi v0.12.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gunizi-v0.12.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing release must not be overwritten";exit 1
          fi
          if [ "$PERMANENT_SIGNING" = "true" ]; then
            gh release create "$TAG" GunIzi-v0.12.0.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Günİzi v0.12.0" --notes-file install-note.txt
          else
            gh release create "$TAG" GunIzi-v0.12.0.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Günİzi v0.12.0" --notes-file install-note.txt --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease
