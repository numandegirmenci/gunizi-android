name: Günİzi v0.13.1 Build and Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v0131-memory.yml'
      - 'app/src/main/java/com/gunizi/app/**'
      - 'app/src/test/java/com/gunizi/app/**'
      - 'app/build.gradle'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gunizi-0131-validation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Fetch Günİzi with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify offline native files
        run: |
          test -f third_party/callvault/app/src/main/cpp/whispercv.cpp
          test -f third_party/callvault/third_party/whisper.cpp/CMakeLists.txt
          test -f third_party/callvault/third_party/llama.cpp/CMakeLists.txt
          test -f third_party/callvault/app/src/main/assets/ggml-silero-v5.1.2.bin
      - name: Check manual analysis and live-tracking contracts
        run: |
          set -euo pipefail
          ! grep -F 'setRequiresBatteryNotLow(true)' app/src/main/java/com/gunizi/app/DailySummaryWorker.java
          grep -F 'LiveTranscriptStore.append' app/src/main/java/com/gunizi/app/CallVaultWhisperEngine.kt
          grep -F 'showPreparing' app/src/main/java/com/gunizi/app/SummaryActivity.java
          grep -F 'FIRST_CHUNK=12' app/src/main/java/com/gunizi/app/AudioChunkDecoder.java
      - name: Android compilation and Java unit tests
        run: |
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:testDebugUnitTest
      - name: Verify package, native binaries and signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | head -n 1 | tee package.txt
          grep -F "name='com.gunizi.app.ai8'" package.txt
          grep -F "versionCode='17'" package.txt
          grep -F "versionName='0.13.1'" package.txt
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libwhispercv.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libllamacv.so'
          unzip -Z1 "$APK" | grep -F 'assets/ggml-silero-v5.1.2.bin'
          "$SIGNER" verify "$APK"
          sha256sum "$APK"
      - name: Upload Günİzi APK
        uses: actions/upload-artifact@v4
        with:
          name: GunIzi-v0.13.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
