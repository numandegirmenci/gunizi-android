name: Publish Günİzi v0.11.1 adaptive status TEST
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0111-stability-test.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned stability build and download its APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="numandegirmenci/gunizi-android"
          RUN_ID="44981093979"
          SOURCE_SHA="1fde2bcfdc46a6fa4d476b91ffa2d2b9d1bd3c45"
          for i in $(seq 1 150); do
            STATUS="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .status)"
            if [ "$STATUS" = "completed" ]; then break; fi
            sleep 8
          done
          test "$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .conclusion)" = success ||
            { echo "::error::The exact stability APK build and tests have not passed"; exit 1; }
          test "$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .head_sha)" = "$SOURCE_SHA" ||
            { echo "::error::Pinned source SHA does not match"; exit 1; }
          mkdir -p "$RUNNER_TEMP/stability"
          gh run download "$RUN_ID" --repo "$REPO" --name GunIzi-debug-apk --dir "$RUNNER_TEMP/stability"
          APK="$(find "$RUNNER_TEMP/stability" -type f -name '*.apk' | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test "$(find "$RUNNER_TEMP/stability" -type f -name '*.apk' | wc -l)" -eq 1
          cp "$APK" GunIzi-Stabilite-Test-v0.11.1.apk
          sha256sum GunIzi-Stabilite-Test-v0.11.1.apk
      - name: Validate version, isolated package, native engine and signature
        run: |
          set -euo pipefail
          APK="GunIzi-Stabilite-Test-v0.11.1.apk"
          unzip -tq "$APK" | tail -n 2
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$AAPT" && test -n "$SIGNER"
          "$AAPT" dump badging "$APK" | head -n 1 | tee package.txt
          grep -F "name='com.gunizi.app.ai4'" package.txt
          grep -F "versionCode='13'" package.txt
          grep -F "versionName='0.11.1-test'" package.txt
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libwhispercv.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libllamacv.so'
          unzip -Z1 "$APK" | grep -F 'assets/ggml-silero-v5.1.2.bin'
          "$SIGNER" verify "$APK"
      - name: Publish honest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="numandegirmenci/gunizi-android"
          TAG="test-v0.11.1"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::The existing release will not be overwritten";exit 1
          fi
          gh release create "$TAG" GunIzi-Stabilite-Test-v0.11.1.apk \
            --repo "$REPO" \
            --target "1fde2bcfdc46a6fa4d476b91ffa2d2b9d1bd3c45" \
            --title "Günİzi v0.11.1 • Uyarlanabilir Canlı İşlem ve Stabilite (TEST)" \
            --notes-file release-notes/v0.11.1.md --prerelease
          gh release view "$TAG" --repo "$REPO" --json url,assets,isPrerelease
