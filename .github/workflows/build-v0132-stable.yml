name: Günİzi v0.13.2 APK — Stability and Full Models
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v0132-stable.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gunizi-v0132-stable
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Fetch native source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Guard full-quality model selection and lossless report
        run: |
          set -euo pipefail
          grep -F 'p.getString("speech_model",AiModelStore.WHISPER_TURBO_Q8)' app/src/main/java/com/gunizi/app/AnalysisPreferences.java
          grep -F 'p.getString("ai_model",AiModelStore.GEMMA)' app/src/main/java/com/gunizi/app/Prefs.java
          grep -F 'LlamaNative.generate(ptr,prompt,1650,4,SummaryGrammar.JSON)' app/src/main/java/com/gunizi/app/FullDaySummarizer.kt
          grep -F 'rows.forEach{report.append(it)' app/src/main/java/com/gunizi/app/FullDaySummarizer.kt
          grep -F 'analysisLlmExtractMs' app/src/main/java/com/gunizi/app/FullDaySummarizer.kt
          grep -F 'analysisSpeechSource' app/src/main/java/com/gunizi/app/AiLiveStatusCard.java
          grep -F 'LiveTranscriptStore.append' app/src/main/java/com/gunizi/app/CallVaultWhisperEngine.kt
          test -f third_party/callvault/app/src/main/cpp/whispercv.cpp
          test -f third_party/callvault/third_party/whisper.cpp/CMakeLists.txt
          test -f third_party/callvault/third_party/llama.cpp/CMakeLists.txt
          test -f third_party/callvault/app/src/main/assets/ggml-silero-v5.1.2.bin
      - name: Build Android and run all JVM unit tests
        run: |
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:testDebugUnitTest
      - name: Verify APK version signature native libraries and archive
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | head -n1 | tee package.txt
          grep -F "name='com.gunizi.app.ai9'" package.txt
          grep -F "versionCode='18'" package.txt
          grep -F "versionName='0.13.2'" package.txt
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libwhispercv.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libllamacv.so'
          unzip -Z1 "$APK" | grep -F 'assets/ggml-silero-v5.1.2.bin'
          "$SIGNER" verify "$APK"
          cp "$APK" GunIzi-v0.13.2.apk
          sha256sum GunIzi-v0.13.2.apk | tee SHA256.txt
      - name: Upload full-model stable APK
        uses: actions/upload-artifact@v4
        with:
          name: GunIzi-v0.13.2-APK
          path: |
            GunIzi-v0.13.2.apk
            SHA256.txt
          if-no-files-found: error
          retention-days: 90
