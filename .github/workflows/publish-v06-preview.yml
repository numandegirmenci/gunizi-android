# One-time publication of the already-tested v0.6 debug artifact.
# Does NOT create or expose a signing keystore. Later updates must use signed releases.
name: Publish Günİzi v0.6 Preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v06-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Retrieve exact previously built APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gunizi"
          gh run download 44968804658 --repo numandegirmenci/gunizi-android \
            --name GunIzi-debug-apk --dir "$RUNNER_TEMP/gunizi"
          FILE="$(find "$RUNNER_TEMP/gunizi" -type f -name '*.apk' | head -n 1)"
          test -n "$FILE"
          echo 'f7cdc61a041aaba3f835649faded855da21f089ee25144b8c9db37a60dbfb817  ' "$FILE" | sed 's/  / /' >/dev/null
          test "$(sha256sum "$FILE" | cut -d' ' -f1)" = "f7cdc61a041aaba3f835649faded855da21f089ee25144b8c9db37a60dbfb817"
          cp "$FILE" "GunIzi-v0.6.0.apk"
      - name: Publish GitHub Release with exact APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          versionCode: 6

          ## Günİzi v0.6.0 — ilk GitHub yayını

          - Bildirimden geriye dönük **son 15 dakika, son 1 saat, son 2 saat** sesini kaydetme
          - Mesai kaydı: telefon saatiyle haftalık çalışma takvimi
          - Yerel yapay zeka için Whisper + Qwen3 model indirme ve konu bazlı HTML/CSV rapor altyapısı
          - Sessiz mikrofon hizmeti bildirimi ve arama sesi kesintisi uyarısı

          **Önemli:** Bu, daha önceki Android Debug APK derlemesinin birebir kopyasıdır.
          Deneysel bir test sürümüdür; uzun ses kayıtları ve yapay zeka işlem hattı
          gerçek cihazda kapsamlı doğrulanmamıştır.

          **İmza / güncelleme uyarısı:** Mevcut debug kurulumun imzası farklıysa bu
          dosya üzerine yüklenmez. Önce kişisel ses kayıtlarını yedekle.
          Gelecek sürümlerin sorunsuz yükseltilmesi için kalıcı gizli imzalama anahtarı
          GitHub Actions Secrets altında ayarlanmalıdır.

          Android uygulaması **versionCode: 6** olan bu yayını v0.6 kuruluysa
          "Günİzi güncel" olarak gösterecektir. Sonraki sürüm için versionCode
          en az 7 olmalıdır.
          NOTES
          if gh release view v0.6.0 --repo numandegirmenci/gunizi-android >/dev/null 2>&1; then
            echo "v0.6.0 was already published; preserving the original verified APK"
          else
            gh release create v0.6.0 "GunIzi-v0.6.0.apk" \
              --repo numandegirmenci/gunizi-android \
              --target 6d965e6b951e317277f5dee280688a10fc629901 \
              --title "Günİzi v0.6.0 (Test APK)" --notes-file release-notes.md --latest
          fi
          gh release view v0.6.0 --repo numandegirmenci/gunizi-android --json url,assets
