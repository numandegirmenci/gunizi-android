name: Günİzi v0.14.0 · Zamanlı Geçmiş APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v0140-scheduled-history.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gunizi-v0140-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout native dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Static contracts
        run: |
          set -euo pipefail
          grep -F "historyScheduleEnabled" app/src/main/java/com/gunizi/app/Prefs.java
          grep -F "ACTION_ARM_HISTORY_SCHEDULE" app/src/main/java/com/gunizi/app/RecorderService.java
          grep -F "stopHistory(true)" app/src/main/java/com/gunizi/app/RecorderService.java
          grep -F "Zamanlı geçmiş dinleme" app/src/main/java/com/gunizi/app/MainActivity.java
          grep -F "HistoryScheduleWindow.active" app/src/main/java/com/gunizi/app/Prefs.java
          grep -F "historyScheduledArmed" app/src/main/java/com/gunizi/app/RecorderService.java
          test -f app/src/test/java/com/gunizi/app/HistoryScheduleWindowTest.java
          test -f third_party/callvault/app/src/main/cpp/whispercv.cpp
          test -f third_party/callvault/third_party/whisper.cpp/CMakeLists.txt
          test -f third_party/callvault/third_party/llama.cpp/CMakeLists.txt
          test -f third_party/callvault/app/src/main/assets/ggml-silero-v5.1.2.bin
      - name: Assemble APK + run JVM tests
        run: |
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:testDebugUnitTest
      - name: Verify signed APK identity and native libraries
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | head -n 1 | tee package.txt
          grep -F "name='com.gunizi.app.ai10'" package.txt
          grep -F "versionCode='19'" package.txt
          grep -F "versionName='0.14.0'" package.txt
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libwhispercv.so'
          unzip -Z1 "$APK" | grep -F 'lib/arm64-v8a/libllamacv.so'
          unzip -Z1 "$APK" | grep -F 'assets/ggml-silero-v5.1.2.bin'
          "$SIGNER" verify "$APK"
          cp "$APK" GunIzi-v0.14.0.apk
          sha256sum GunIzi-v0.14.0.apk | tee SHA256.txt
      - name: Upload checked APK
        uses: actions/upload-artifact@v4
        with:
          name: GunIzi-v0.14.0-APK
          path: |
            GunIzi-v0.14.0.apk
            SHA256.txt
          if-no-files-found: error
          retention-days: 90
