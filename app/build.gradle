plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.gunizi.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gunizi.app'
        minSdk 29
        targetSdk 35
        ndk { abiFilters 'arm64-v8a' }
        versionCode 21
        versionName '0.16.0'
        manifestPlaceholders = [appLabel: 'Günİzi']
    }
    buildTypes {
        debug {
            // Side-by-side test install. Never overwrite the installed production app.
            applicationIdSuffix '.ai16'
            manifestPlaceholders = [appLabel: 'Günİzi']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [appLabel: 'Günİzi']
        }
    }
    ndkVersion '27.2.12479018'
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt') ; version '3.22.1' } }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    sourceSets { main { assets.srcDirs += ["${rootProject.projectDir}/third_party/callvault/app/src/main/assets"] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}

/*
 * Signed GitHub Release APKs require a single, persistent private keystore.
 * It is supplied from GitHub Actions Secrets and NEVER committed to git.
 * Debug builds remain independent and may not install over differently signed releases.
 */
def signingStorePath = System.getenv('GUNIZI_KEYSTORE_PATH')
if (signingStorePath) {
    android.signingConfigs.create('guniziRelease') {
        storeFile file(signingStorePath)
        storePassword System.getenv('GUNIZI_KEYSTORE_PASSWORD')
        keyAlias System.getenv('GUNIZI_KEY_ALIAS')
        keyPassword System.getenv('GUNIZI_KEY_PASSWORD')
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.guniziRelease
}
